<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer luxury ring -->
  <circle cx="100" cy="100" r="92" stroke="url(#goldGradient)" stroke-width="3" stroke-dasharray="1 2"/>
  <circle cx="100" cy="100" r="86" stroke="url(#goldGradient)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="82" stroke="url(#goldGradient)" stroke-width="0.75" stroke-opacity="0.4"/>
  
  <defs>
    <linearGradient id="goldGradient" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA821C"/>
      <stop offset="100%" stop-color="#EED588"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Steam curls -->
  <path d="M93 52 C90 46, 95 40, 92 34" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100 50 C98 42, 104 36, 101 28" stroke="url(#goldGradient)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M107 53 C105 47, 110 41, 108 35" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cloche Handle -->
  <circle cx="100" cy="57" r="4.5" fill="url(#goldGradient)"/>

  <!-- Cloche Dome -->
  <path d="M60 92 C60 67, 78 59, 100 59 C122 59, 140 67, 140 92 Z" fill="url(#goldGradient)"/>
  
  <!-- Cloche Trim Rim -->
  <rect x="52" y="92" width="96" height="5" rx="2.5" fill="url(#goldGradient)"/>

  <!-- Platter Plate -->
  <ellipse cx="100" cy="98" rx="55" ry="3.5" fill="url(#goldGradient)"/>
  <path d="M48 98 Q100 106 152 98 Q100 102 48 98 Z" fill="url(#goldGradient)"/>

  <!-- Serving Hand -->
  <path d="M72 135 C75 125, 82 118, 93 114 C98 112, 108 112, 120 115 C125 116, 131 118, 127 122 C122 125, 114 124, 106 122 C101 121, 95 122, 90 125 C84 129, 80 134, 78 138 Z" fill="url(#goldGradient)"/>
  <path d="M86 117 C92 110, 105 108, 122 108 C128 108, 133 109, 134 112 C132 114, 126 114, 118 113 C106 112, 97 114, 91 119 Z" fill="url(#goldGradient)"/>

  <!-- Wheat / Laurel decorative branches -->
  <path d="M42 100 C38 120, 52 145, 75 158" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M158 100 C162 120, 148 145, 125 158" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Small Laurel leaves -->
  <circle cx="43" cy="112" r="2.5" fill="url(#goldGradient)"/>
  <circle cx="47" cy="126" r="2.5" fill="url(#goldGradient)"/>
  <circle cx="55" cy="138" r="2.5" fill="url(#goldGradient)"/>
  <circle cx="65" cy="148" r="2.5" fill="url(#goldGradient)"/>

  <circle cx="157" cy="112" r="2.5" fill="url(#goldGradient)"/>
  <circle cx="153" cy="126" r="2.5" fill="url(#goldGradient)"/>
  <circle cx="145" cy="138" r="2.5" fill="url(#goldGradient)"/>
  <circle cx="135" cy="148" r="2.5" fill="url(#goldGradient)"/>
</svg>
